<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebFramed - Submit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="assets/images/WFLogo.png" alt="Website Gallery Logo">
        </a>
        <nav>
            <div class="nav-button">
                <ul>
                    <li><a href="index.html"><button>Home</button></a></li>
                    <li><a href="about.html"><button>About</button></a></li>
                    <li><a href="contact.html"><button>Submit</button></a></li>
                </ul>
            </div>
        </nav>
        
    </header>
    <main>
        <h1>Submission Form</h1>
        
        <form action="contact.html" method="get">
       <div class="submission-form">
        <h2>Everything here is only a demonstration. No information will be submitted, every information is fictional, and nothing will be sent to your email. .</h2>

        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Input username here." name="username" required>
        </div>
        <div class="form-group">
            <label for="website-name">Website Name:</label>
            <input type="text" id="website-name" placeholder="Input website name here." name="website-name" required>
        </div>
        <div class="form-group">
            <label for="website-url">Website URL:</label>
            <input type="text" id="website-url" placeholder="Input website URL." name="website-url" required>
        </div>
        <div class="form-group">
            <label for="website-image">Image File (2:1):</label>
            <input type="file" id="website-image" accept="image/*" placeholder="" class="file-input" name="website-image" required>
        </div>
        <div class="form-group">
            <label for="website-notes">Notes:</label>
            <textarea type="textarea" id="website-notes" class="text-area-input" name="website-notes" placeholder="Please type notes for moderators." required
            rows = 4></textarea>
            
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="ex.: john.doe@example.com" required>
        </div>
        <button type="submit" class="submit-button">Add</button>



       </div>
       </form>
    </main>
    <footer>
        <p>&copy; 2026 WebFramed</p>
    </footer>
</body>
</html>
